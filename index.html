<style>
/* Layout: uma coluna de celular, trilha de escolhas no topo, barra de abas fixa embaixo. GM em esmeralda, CM em ouro. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --fg:#10201A; --muted:#58695F; --line:#D7DFDA;
  --gm:#0B6B4F; --gm-bg:#DFF0E8; --gm-ink:#07402F;
  --cm:#8A5E08; --cm-bg:#F5EBCF; --cm-ink:#5A3D04;
  --ok:#0B6B4F; --warn-bg:#FBF3DC;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1411; --surface:#14201B; --fg:#E7F0EA; --muted:#93A59B; --line:#263630;
    --gm:#55CBA0; --gm-bg:#143629; --gm-ink:#BDEBD9;
    --cm:#E5B54F; --cm-bg:#392C10; --cm-ink:#F3DDA6;
    --ok:#55CBA0; --warn-bg:#2B2410; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#14201B; --fg:#E7F0EA; --muted:#93A59B; --line:#263630;
  --gm:#55CBA0; --gm-bg:#143629; --gm-ink:#BDEBD9;
  --cm:#E5B54F; --cm-bg:#392C10; --cm-ink:#F3DDA6;
  --ok:#55CBA0; --warn-bg:#2B2410; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 var(--f-body);
  padding-block:20px 104px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:560px; margin:0 auto}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-0.01em}
h1{font-size:28px; line-height:1.1; font-weight:700}
h2{font-size:20px; line-height:1.2; font-weight:700}
h3{font-size:16px; font-weight:700}
.sub{color:var(--muted); font-size:14px; margin:6px 0 0}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left}
button:focus-visible{outline:3px solid var(--gm); outline-offset:2px}
.trail{display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 16px}
.chip{font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); min-height:34px}
.chip.on{color:var(--fg); border-color:var(--fg)}
.chip.gm{background:var(--gm-bg); color:var(--gm-ink); border-color:transparent}
.chip.cm{background:var(--cm-bg); color:var(--cm-ink); border-color:transparent}
.q{font-family:var(--f-display); font-size:19px; font-weight:700; margin:0 0 12px}
.choices{display:grid; gap:12px}
.choice{display:block; width:100%; border-radius:16px; padding:18px; min-height:96px; border:1px solid var(--line); background:var(--surface)}
.choice b{display:block; font-family:var(--f-display); font-size:22px; line-height:1.15}
.choice span{display:block; margin-top:6px; font-size:14px; color:var(--muted)}
.choice.gm{background:var(--gm-bg); border-color:transparent}
.choice.gm b{color:var(--gm-ink)}
.choice.cm{background:var(--cm-bg); border-color:transparent}
.choice.cm b{color:var(--cm-ink)}
.choice.soon{border-style:dashed; background:transparent; cursor:default}
.choice.soon b{color:var(--muted)}
.banner{border-radius:16px; padding:14px 16px; margin-bottom:16px}
.banner.gm{background:var(--gm-bg); color:var(--gm-ink)}
.banner.cm{background:var(--cm-bg); color:var(--cm-ink)}
.banner h2{color:inherit}
.label{font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin:22px 0 8px}
.comps{display:flex; flex-wrap:wrap; gap:8px}
.comps span{font-size:14px; padding:6px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--line)}
.bar{height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:0 0 12px}
.bar i{display:block; height:100%; background:var(--gm); width:0; transition:width .2s}
.cm-theme .bar i{background:var(--cm)}
.steps{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.step{display:flex; gap:12px; width:100%; padding:12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); min-height:64px}
.step .n{flex:0 0 28px; height:28px; border-radius:50%; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700}
.step .t{min-width:0}
.step .t b{display:block; font-weight:600}
.step .t span{display:block; font-size:14px; color:var(--muted); margin-top:2px}
.step.done{background:transparent}
.step.done .n{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.step.done .t b{text-decoration:line-through; color:var(--muted)}
.note{margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--warn-bg); font-size:14px}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.btn{padding:10px 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; min-height:44px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border-radius:14px; background:var(--line); margin:16px 0}
.seg button{text-align:center; padding:10px; border-radius:10px; font-weight:600; min-height:44px}
.seg button.on.gm{background:var(--gm); color:var(--surface)}
.seg button.on.cm{background:var(--cm); color:var(--surface)}
.group{margin-top:18px}
.group h3{margin-bottom:8px}
.item{padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-top:0}
.item:first-of-type{border-top:1px solid var(--line); border-radius:14px 14px 0 0}
.item:last-child{border-radius:0 0 14px 14px}
.item:only-child{border-radius:14px; border-top:1px solid var(--line)}
.item b{display:block; font-weight:600}
.item span{display:block; font-size:14px; color:var(--muted)}
.cats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.catbtn{display:block; padding:14px; min-height:84px; border-radius:14px; background:var(--surface); border:1px solid var(--line)}
.catbtn b{display:block; font-family:var(--f-display); font-size:17px; line-height:1.2}
.catbtn span{display:block; margin-top:4px; font-size:13px; color:var(--muted)}
.catbtn.empty{background:transparent; border-style:dashed}
.catbtn.empty b{color:var(--muted)}
.cit{display:flex; gap:12px; width:100%; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-top:0; min-height:60px}
.cit:first-of-type{border-top:1px solid var(--line); border-radius:14px 14px 0 0}
.cit:last-child{border-radius:0 0 14px 14px}
.cit:only-child{border-radius:14px; border-top:1px solid var(--line)}
.cit .tx{min-width:0}
.cit .tx b{display:block; font-weight:600}
.cit .d{display:block; font-size:14px; color:var(--muted)}
.cit .add{flex:0 0 auto; font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line); white-space:nowrap}
.cit.on .add{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.crow{display:flex; gap:12px; align-items:center; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-top:0}
.crow:first-of-type{border-top:1px solid var(--line); border-radius:14px 14px 0 0}
.crow:last-child{border-radius:0 0 14px 14px}
.crow:only-child{border-radius:14px; border-top:1px solid var(--line)}
.crow .tx{flex:1; min-width:0}
.crow .tx b{display:block; font-weight:600}
.crow .tx .d{display:block; font-size:13px; color:var(--muted)}
.crow.done .tx b{text-decoration:line-through; color:var(--muted)}
.cbox{flex:0 0 28px; height:28px; border-radius:8px; border:2px solid var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:transparent}
.crow.done .cbox{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.qty{flex:0 0 auto; display:flex; align-items:center; gap:6px}
.qb{width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; line-height:1}
.qn{min-width:20px; text-align:center; font-weight:600; font-variant-numeric:tabular-nums}
.foot{margin-top:24px; font-size:13px; color:var(--muted)}
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(3,1fr);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav button{text-align:center; padding:10px 4px; border-radius:12px; font-size:13px; font-weight:600; color:var(--muted); min-height:48px}
nav button.on{color:var(--fg); background:var(--bg)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

function itemById(id){ for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i]; return null; }
function catLabel(id){ for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === id) return CATS[i][1]; return id; }
var AREAS = [['pro','Protético','Pilares, moldagem, parafusos e laboratório'],['cir','Cirúrgico','Implantes, kits, brocas, drivers e instrumental']];
var CIR_CATS = ['implantes','kits','brocas','drivers'];
var CIR_INS = ['gm-ins-perfil','cm-ins-perfil','gm-ins-medang','cm-ins-medang','gm-ins-ind','gm-ins-prof','gm-ins-pinca','cm-ins-para','cm-ins-macho','cm-ins-remov','cm-ins-posic','cm-ins-sonda','cm-ins-pinca'];
function areaOf(x){ return has(CIR_CATS, x.cat) || has(CIR_INS, x.id) ? 'cir' : 'pro'; }
function areaLabel(id){ for (var i = 0; i < AREAS.length; i++) if (AREAS[i][0] === id) return AREAS[i][1]; return id; }
function catsOf(area){ return CATS.filter(function(c){ return area === 'cir' ? (has(CIR_CATS, c[0]) || c[0] === 'instrumental') : !has(CIR_CATS, c[0]); }); }
function countIn(id, area){ return ITEMS.filter(function(x){ return x.cat === id && (!area || areaOf(x) === area); }).length; }

var fase = null, view = 'guia', brand = null, path = [], cat = [], pLine = 'gm';
var store = {};

function load(k){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : (store[k] || []); } catch(e){ return store[k] || []; } }
function save(k, v){ store[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function has(a, x){ return a.indexOf(x) > -1; }
function toggle(k, i){
  var a = load(k).slice(), p = a.indexOf(i);
  if (p > -1) a.splice(p, 1); else a.push(i);
  save(k, a);
}
function cartFind(c, id){ for (var i = 0; i < c.length; i++) if (c[i].id === id) return i; return -1; }
function cartToggle(id){
  var c = load('cart').slice(), p = cartFind(c, id);
  if (p > -1) c.splice(p, 1); else c.push({id:id, q:1, done:false});
  save('cart', c);
}
function cartQty(id, d){
  var c = load('cart').slice(), p = cartFind(c, id);
  if (p < 0) return;
  c[p] = {id:id, q:c[p].q + d, done:c[p].done};
  if (c[p].q < 1) c.splice(p, 1);
  save('cart', c);
}
function cartDone(id){
  var c = load('cart').slice(), p = cartFind(c, id);
  if (p < 0) return;
  c[p] = {id:id, q:c[p].q, done:!c[p].done};
  save('cart', c);
}

  document.getElementById('t-compras').textContent = n ? 'Compras · ' + n : 'Compras';
}

function setView(v){
  view = v;

}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var a = el.getAttribute('data-act'), v = el.getAttribute('data-v'), id = el.getAttribute('data-id');
  var i = parseInt(el.getAttribute('data-i'), 10), n = parseInt(el.getAttribute('data-n'), 10);
  if (a === 'tab') return setView(v);
  if (a === 'opencat') return setView('catalogo');
  if (a === 'brand') brand = v;
  else if (a === 'pick') path.push(v);
  else if (a === 'fase'){ fase = v; path = []; }
  else if (a === 'gobrand'){ fase = null; path = []; }
  else if (a === 'back'){ if (path.length) path.pop(); else if (fase) fase = null; else brand = null; }
  else if (a === 'reset'){ brand = null; fase = null; path = []; }
  else if (a === 'goto') path = path.slice(0, n);
  else if (a === 'step') toggle('done:' + (fase === 'cir' ? 'cir|' : '') + path.join('|'), i);
  else if (a === 'clear') save('done:' + (fase === 'cir' ? 'cir|' : '') + path.join('|'), []);
  else if (a === 'line') pLine = v;
  else if (a === 'cpick') cat.push(v);
  else if (a === 'cback') cat.pop();
  else if (a === 'creset') cat = [];
  else if (a === 'cgoto') cat = cat.slice(0, n);
  else if (a === 'cart') cartToggle(id);
  else if (a === 'cdone') cartDone(id);
  else if (a === 'qplus') cartQty(id, 1);
  else if (a === 'qminus') cartQty(id, -1);
  else if (a === 'clearcart') save('cart', []);
  var y = window.scrollY;
  render();
  var keep = a === 'step' || a === 'line' || a === 'cart' || a === 'cdone' || a === 'qplus' || a === 'qminus';
  if (keep) window.scrollTo(0, y); else window.scrollTo(0, 0);
});

window.addEventListener('hashchange', function(){
  var h = location.hash.slice(1);
  if (has(VIEWS, h)){ view = h; render(); }
});
(function(){
  var h = location.hash.slice(1);
  if (has(VIEWS, h)) view = h;
  render();
})();
</script>

</body></html>
