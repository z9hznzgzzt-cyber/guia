<style>
/* Layout: uma coluna de celular, trilha de escolhas no topo, barra de abas fixa embaixo. GM em esmeralda, CM em ouro. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --fg:#10201A; --muted:#58695F; --line:#D7DFDA;
  --gm:#0B6B4F; --gm-bg:#DFF0E8; --gm-ink:#07402F;
  --cm:#8A5E08; --cm-bg:#F5EBCF; --cm-ink:#5A3D04;
  --ok:#0B6B4F; --warn-bg:#FBF3DC;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1411; --surface:#14201B; --fg:#E7F0EA; --muted:#93A59B; --line:#263630;
    --gm:#55CBA0; --gm-bg:#143629; --gm-ink:#BDEBD9;
    --cm:#E5B54F; --cm-bg:#392C10; --cm-ink:#F3DDA6;
    --ok:#55CBA0; --warn-bg:#2B2410; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#14201B; --fg:#E7F0EA; --muted:#93A59B; --line:#263630;
  --gm:#55CBA0; --gm-bg:#143629; --gm-ink:#BDEBD9;
  --cm:#E5B54F; --cm-bg:#392C10; --cm-ink:#F3DDA6;
  --ok:#55CBA0; --warn-bg:#2B2410; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 var(--f-body);
  padding-block:20px 104px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:560px; margin:0 auto}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-0.01em}
h1{font-size:28px; line-height:1.1; font-weight:700}
h2{font-size:20px; line-height:1.2; font-weight:700}
h3{font-size:16px; font-weight:700}
.sub{color:var(--muted); font-size:14px; margin:6px 0 0}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left}
button:focus-visible{outline:3px solid var(--gm); outline-offset:2px}
.trail{display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 16px}
.chip{font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); min-height:34px}
.chip.on{color:var(--fg); border-color:var(--fg)}
.chip.gm{background:var(--gm-bg); color:var(--gm-ink); border-color:transparent}
.chip.cm{background:var(--cm-bg); color:var(--cm-ink); border-color:transparent}
.q{font-family:var(--f-display); font-size:19px; font-weight:700; margin:0 0 12px}
.choices{display:grid; gap:12px}
.choice{display:block; width:100%; border-radius:16px; padding:18px; min-height:96px; border:1px solid var(--line); background:var(--surface)}
.choice b{display:block; font-family:var(--f-display); font-size:22px; line-height:1.15}
.choice span{display:block; margin-top:6px; font-size:14px; color:var(--muted)}
.choice.gm{background:var(--gm-bg); border-color:transparent}
.choice.gm b{color:var(--gm-ink)}
.choice.cm{background:var(--cm-bg); border-color:transparent}
.choice.cm b{color:var(--cm-ink)}
.choice.soon{border-style:dashed; background:transparent; cursor:default}
.choice.soon b{color:var(--muted)}
.banner{border-radius:16px; padding:14px 16px; margin-bottom:16px}
.banner.gm{background:var(--gm-bg); color:var(--gm-ink)}
.banner.cm{background:var(--cm-bg); color:var(--cm-ink)}
.banner h2{color:inherit}
.label{font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin:22px 0 8px}
.comps{display:flex; flex-wrap:wrap; gap:8px}
.comps span{font-size:14px; padding:6px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--line)}
.bar{height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:0 0 12px}
.bar i{display:block; height:100%; background:var(--gm); width:0; transition:width .2s}
.cm-theme .bar i{background:var(--cm)}
.steps{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.step{display:flex; gap:12px; width:100%; padding:12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); min-height:64px}
.step .n{flex:0 0 28px; height:28px; border-radius:50%; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700}
.step .t{min-width:0}
.step .t b{display:block; font-weight:600}
.step .t span{display:block; font-size:14px; color:var(--muted); margin-top:2px}
.step.done{background:transparent}
.step.done .n{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.step.done .t b{text-decoration:line-through; color:var(--muted)}
.note{margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--warn-bg); font-size:14px}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.btn{padding:10px 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; min-height:44px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border-radius:14px; background:var(--line); margin:16px 0}
.seg button{text-align:center; padding:10px; border-radius:10px; font-weight:600; min-height:44px}
.seg button.on.gm{background:var(--gm); color:var(--surface)}
.seg button.on.cm{background:var(--cm); color:var(--surface)}
.seg.n3{grid-template-columns:1fr 1fr 1fr}
.chip.go{background:var(--gm-bg); color:var(--gm-ink); border-color:transparent}
.chip.mx,.chip.he{background:var(--cm-bg); color:var(--cm-ink); border-color:transparent}
.group{margin-top:18px}
.group h3{margin-bottom:8px}
.item{padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-top:0}
.item:first-of-type{border-top:1px solid var(--line); border-radius:14px 14px 0 0}
.item:last-child{border-radius:0 0 14px 14px}
.item:only-child{border-radius:14px; border-top:1px solid var(--line)}
.item b{display:block; font-weight:600}
.item span{display:block; font-size:14px; color:var(--muted)}
.cats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.catbtn{display:block; padding:14px; min-height:84px; border-radius:14px; background:var(--surface); border:1px solid var(--line)}
.catbtn b{display:block; font-family:var(--f-display); font-size:17px; line-height:1.2}
.catbtn span{display:block; margin-top:4px; font-size:13px; color:var(--muted)}
.catbtn.empty{background:transparent; border-style:dashed}
.catbtn.empty b{color:var(--muted)}
.cit{display:flex; gap:12px; width:100%; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-top:0; min-height:60px}
.cit:first-of-type{border-top:1px solid var(--line); border-radius:14px 14px 0 0}
.cit:last-child{border-radius:0 0 14px 14px}
.cit:only-child{border-radius:14px; border-top:1px solid var(--line)}
.cit .tx{min-width:0}
.cit .tx b{display:block; font-weight:600}
.cit .d{display:block; font-size:14px; color:var(--muted)}
.cit .add{flex:0 0 auto; font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line); white-space:nowrap}
.cit.on .add{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.crow{display:flex; gap:12px; align-items:center; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-top:0}
.crow:first-of-type{border-top:1px solid var(--line); border-radius:14px 14px 0 0}
.crow:last-child{border-radius:0 0 14px 14px}
.crow:only-child{border-radius:14px; border-top:1px solid var(--line)}
.crow .tx{flex:1; min-width:0}
.crow .tx b{display:block; font-weight:600}
.crow .tx .d{display:block; font-size:13px; color:var(--muted)}
.crow.done .tx b{text-decoration:line-through; color:var(--muted)}
.cbox{flex:0 0 28px; height:28px; border-radius:8px; border:2px solid var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:transparent}
.crow.done .cbox{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.qty{flex:0 0 auto; display:flex; align-items:center; gap:6px}
.qb{width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; line-height:1}
.qn{min-width:20px; text-align:center; font-weight:600; font-variant-numeric:tabular-nums}
.foot{margin-top:24px; font-size:13px; color:var(--muted)}
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(3,1fr);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav button{text-align:center; padding:10px 4px; border-radius:12px; font-size:13px; font-weight:600; color:var(--muted); min-height:48px}
nav button.on{color:var(--fg); background:var(--bg)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

  marca = marca || 'Neodent';
  return [
    ['Paciente e datas','Nome do paciente, seu nome e CRO, data da moldagem e data desejada de entrega.'],
    ['Dentes','Número de cada dente a restaurar. Identifique no molde ou no modelo cada análogo com o número do dente.'],
    ['Tipo de trabalho','Coroa unitária parafusada sobre ' + pilar + '.'],

  ];
}

var store = {};

function load(k){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : (store[k] || []); } catch(e){ return store[k] || []; } }
function save(k, v){ store[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function has(a, x){ return a.indexOf(x) > -1; }
function toggle(k, i){
  var a = load(k).slice(), p = a.indexOf(i);
  if (p > -1) a.splice(p, 1); else a.push(i);
  save(k, a);
}
function cartFind(c, id){ for (var i = 0; i < c.length; i++) if (c[i].id === id) return i; return -1; }
function cartToggle(id){
  var c = load('cart').slice(), p = cartFind(c, id);
  if (p > -1) c.splice(p, 1); else c.push({id:id, q:1, done:false});
  save('cart', c);
}
function cartQty(id, d){
  var c = load('cart').slice(), p = cartFind(c, id);
  if (p < 0) return;
  c[p] = {id:id, q:c[p].q + d, done:c[p].done};
  if (c[p].q < 1) c.splice(p, 1);
  save('cart', c);
}
function cartDone(id){
  var c = load('cart').slice(), p = cartFind(c, id);
  if (p < 0) return;
  c[p] = {id:id, q:c[p].q, done:!c[p].done};
  save('cart', c);
}

function guia(){
  if (info) return nivelPage();
  var h = '<div class="trail"><button class="chip' + (!brand ? ' on' : '') + '" data-act="reset">Início</button>';
  if (brand) h += '<button class="chip' + (!fase ? ' on' : '') + '" data-act="gobrand">' + BRANDS[brand] + '</button>';
  if (fase) h += '<button class="chip' + (path.length === 0 ? ' on' : '') + '" data-act="goto" data-n="0">' + (fase === 'cir' ? 'Cirúrgico' : 'Protético') + '</button>';
  path.forEach(function(p, i){
    h += '<button class="chip' + (i === 0 && fase === 'pro' ? ' ' + p : '') + (i === path.length - 1 ? ' on' : '') + '" data-act="goto" data-n="' + (i + 1) + '">' + L[p] + '</button>';
  });
  h += '</div>';
  if (!brand){
    h += '<p class="q">1. Qual a marca?</p>' + brandCards('brand');
  } else if (!fase){
    h += '<p class="q">2. Qual a fase do tratamento?</p><div class="choices">'
      + '<button class="choice" data-act="fase" data-v="cir"><b>Cirúrgico</b><span>Implante unitário ou protocolo, passo a passo da cirurgia.</span></button>'
      + '<button class="choice" data-act="fase" data-v="pro"><b>Protético</b><span>Moldagem, pilares e envio ao laboratório.</span></button>' + '</div>'
      + '<div class="row"><button class="btn" data-act="back">Voltar</button></div>';
  } else if (fase === 'cir' && path.length === 0){
    h += '<p class="q">3. Qual o tipo de caso?</p><div class="choices">'
      + '<button class="choice" data-act="pick" data-v="uni"><b>Unitário</b><span>Um implante por dente, cirurgia de um sítio.</span></button>'
      + '<button class="choice" data-act="pick" data-v="prot"><b>Protocolo</b><span>Arcada completa com implantes esplintados.</span></button></div>'
      + '<div class="row"><button class="btn" data-act="back">Voltar</button></div>';
  } else if (fase === 'cir' && path.length === 1){
    h += '<p class="q">4. Qual a linha do implante?</p><div class="choices">';
    if (brand === 'intraoss'){
      h += '<button class="choice gm" data-act="pick" data-v="go"><b>Grand Oss (GO)</b><span>Cone Morse 16°, conexão única. Advanced, Cônico, Extract e Cortical.</span></button>'
        + '<button class="choice cm" data-act="pick" data-v="mx"><b>Max CM</b><span>Cone Morse 11,5°. Advanced, Cônico, Extract e Cortical.</span></button>'
        + '<button class="choice cm" data-act="pick" data-v="he"><b>Titaoss HE</b><span>Hexágono externo, plataforma Ø 4,1 ou 3,4.</span></button>';
    } else {
      h += '<button class="choice gm" data-act="pick" data-v="gm"><b>Implante GM</b><span>Grand Morse, Helix GM e Drive GM.</span></button>'
        + '<button class="choice cm" data-act="pick" data-v="cm"><b>Implante CM</b><span>Cone Morse: Titamax, Alvim e Drive CM.</span></button>';
    }
    h += '</div><div class="row"><button class="btn" data-act="back">Voltar</button></div>';
  } else if (brand === 'intraoss' && fase === 'pro' && path.length === 0){
    h += '<p class="q">3. Qual a linha do implante?</p><div class="choices">'
      + '<button class="choice gm" data-act="pick" data-v="go"><b>Grand Oss (GO)</b><span>Cone Morse 16°.</span></button>'
      + '<button class="choice cm" data-act="pick" data-v="mx"><b>Max CM</b><span>Cone Morse 11,5°.</span></button>'
      + '<button class="choice cm" data-act="pick" data-v="he"><b>Titaoss HE</b><span>Hexágono externo, plataforma Ø 4,1 ou 3,4.</span></button></div>'
      + '<div class="row"><button class="btn" data-act="back">Voltar</button></div>';
  } else if (brand === 'intraoss' && fase === 'pro' && path.length === 1){
    var hh = path[0] === 'he';
    h += '<p class="q">4. Qual o tipo de prótese?</p><div class="choices">'
      + '<button class="choice" data-act="pick" data-v="impl"><b>No implante</b><span>Coroa unitária direto sobre o implante, sem intermediário.</span></button>'
      + (hh ? '' : '<button class="choice" data-act="pick" data-v="cmn"><b>No Abutment CMN</b><span>Coroa unitária parafusada sobre o Abutment CMN.</span></button>')
      + '<button class="choice" data-act="pick" data-v="mini"><b>No Mini Abutment</b><span>Ponte, protocolo ou implantes esplintados.</span></button>'
      + '<button class="choice" data-act="pick" data-v="cim"><b>No Abutment cimentado</b><span>Coroa unitária cimentada, reto ou angulado.</span></button></div>'
      + '<div class="row"><button class="btn" data-act="ninfo">Implante ou pilar?</button></div>'
      + '<div class="row"><button class="btn" data-act="back">Voltar</button></div>';
  } else if (path.length === 0){
    h += '<p class="q">3. Qual a linha do implante?</p><div class="choices">'
      + '<button class="choice gm" data-act="pick" data-v="gm"><b>Implante GM</b><span>Grand Morse, cone Morse 16°, conexão única. Transfer do implante é universal; o análogo do implante tem 3 grupos de diâmetro.</span></button>'
      + '<button class="choice cm" data-act="pick" data-v="cm"><b>Implante CM</b><span>Cone Morse 11,5°. Análogo do implante é um só; no nível do pilar, componentes variam.</span></button></div>'
      + '<div class="row"><button class="btn" data-act="back">Voltar</button></div>';
  } else if (path.length === 1){
    h += '<p class="q">4. Qual o tipo de prótese?</p><div class="choices">'
      + '<button class="choice" data-act="pick" data-v="implante"><b>No implante</b><span>Sem pilar pré-fabricado: munhão anatômico, base de titânio ou pilar personalizado.</span></button>'
      + '<button class="choice" data-act="pick" data-v="pilar"><b>No pilar</b><span>Coroa unitária, um implante por dente.</span></button>'
      + '<button class="choice" data-act="pick" data-v="mini"><b>No mini pilar</b><span>Ponte, protocolo ou implantes esplintados.</span></button></div>'
      + '<div class="row"><button class="btn" data-act="ninfo">Implante ou pilar?</button></div>'
      + '<div class="row"><button class="btn" data-act="back">Voltar</button></div>';
  } else if (path.length === 2 && path[0] === 'cm' && path[1] !== 'implante'){
    h += '<p class="q">5. Qual o tipo de moldagem?</p><div class="choices">'
      + '<button class="choice cm" data-act="pick" data-v="fechada"><b>Moldeira fechada</b><span>Os transfers ficam na boca e são reposicionados no molde. Mais simples.</span></button>'
      + '<button class="choice cm" data-act="pick" data-v="aberta"><b>Moldeira aberta</b><span>Os transfers saem presos no molde. Permite esplintar, mais precisa em vários implantes.</span></button></div>'
      + '<div class="row"><button class="btn" data-act="back">Voltar</button></div>';
  } else {
    var key = keyNow(), d = D[key], done = load('done:' + key), n = d.steps.length;
    h += '<div class="' + d.theme + '-theme"><div class="banner ' + d.theme + '"><h2>' + d.title + '</h2></div>';
    var nv = nivelOf(key);
    if (nv) h += '<div class="note"><b>Moldagem ' + NIVEL_TXT[nv][0].toLowerCase() + '.</b> ' + NIVEL_TXT[nv][1] + '</div><div class="row" style="margin-top:8px"><button class="btn" data-act="ninfo">Implante ou pilar?</button></div>';
    h += '<div class="label">Componentes</div><div class="comps">';
    d.comps.forEach(function(c){ h += '<span>' + c + '</span>'; });
    h += '</div><div class="label">Passo a passo (toque para marcar)</div>';
    h += '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + done.length + '"><i style="width:' + Math.round(done.length / n * 100) + '%"></i></div>';
    h += '<p class="sub" style="margin:0 0 10px">' + done.length + ' de ' + n + ' feitos</p><ol class="steps">';
    d.steps.forEach(function(s, i){
      h += '<li><button class="step' + (has(done, i) ? ' done' : '') + '" data-act="step" data-i="' + i + '" aria-pressed="' + has(done, i) + '"><span class="n">' + (has(done, i) ? '✓' : (i + 1)) + '</span><span class="t"><b>' + s[0] + '</b><span>' + s[1] + '</span></span></button></li>';
    });
    h += '</ol>';
    h += '<div class="label">' + (fase === 'cir' ? 'Checklist antes da cirurgia' : 'O que colocar na ficha do laboratório') + '</div><div class="group" style="margin-top:0">';
    d.ficha.forEach(function(f){ h += '<div class="item"><b>' + f[0] + '</b><span>' + f[1] + '</span></div>'; });
    h += '</div>';
    d.notes.forEach(function(t){ h += '<div class="note">' + t + '</div>'; });
    h += '<div class="note">Torques e alturas: confirme sempre na bula do componente.</div>';
    h += '<div class="row"><button class="btn" data-act="back">Voltar</button><button class="btn" data-act="clear">Limpar marcações</button><button class="btn" data-act="reset">Recomeçar</button></div></div>';
  }
  return h;
}

function catalogo(){
  var h = '<div class="trail"><button class="chip' + (cat.length === 0 ? ' on' : '') + '" data-act="creset">Catálogo</button>';
  if (cat.length > 0) h += '<button class="chip' + (cat.length === 1 ? ' on' : '') + '" data-act="cgoto" data-n="1">' + BRANDS[cat[0]] + '</button>';
  if (cat.length > 1) h += '<button class="chip' + (cat.length === 2 ? ' on' : '') + '" data-act="cgoto" data-n="2">' + areaLabel(cat[1]) + '</button>';
  if (cat.length > 2) h += '<button class="chip on" data-act="cgoto" data-n="3">' + catLabel(cat[2]) + '</button>';
  h += '</div>';
  if (cat.length === 0){
    h += '<p class="q">Qual a marca?</p>' + brandCards('cpick');
  } else if (cat.length === 1){
    h += '<p class="q">Qual área?</p><div class="cats">';
    AREAS.forEach(function(a){
      h += '<button class="catbtn" data-act="cpick" data-v="' + a[0] + '"><b>' + a[1] + '</b><span>' + a[2] + '</span></button>';
    });
    h += '</div><div class="row"><button class="btn" data-act="cback">Voltar</button></div>';
  } else if (cat.length === 2){
    h += '<p class="q">' + areaLabel(cat[1]) + ' ' + BRANDS[cat[0]] + '</p><div class="cats">';
    catsOf(cat[1]).forEach(function(c){
      var n = countIn(c[0], cat[1], cat[0]);
      h += '<button class="catbtn' + (n ? '' : ' empty') + '" data-act="cpick" data-v="' + c[0] + '"><b>' + c[1] + '</b><span>' + (n ? n + (n === 1 ? ' item' : ' itens') : 'Em breve') + '</span></button>';
    });
    h += '</div><div class="row"><button class="btn" data-act="cback">Voltar</button></div>';
  } else {
    var id = cat[2], all = ITEMS.filter(function(x){ return x.cat === id && x.brand === cat[0] && areaOf(x) === cat[1]; }), cart = load('cart');
    h += '<p class="q">' + catLabel(id) + '</p>';
    if (all.length === 0){
      h += '<div class="note">Ainda sem itens. Esta categoria será preenchida depois.</div>';
    } else {
      var LS = LINES[cat[0]];
      if (!has(LS.map(function(l){ return l[0]; }), pLine)) pLine = LS[0][0];
      h += '<div class="seg n' + LS.length + '" role="group" aria-label="Linha">';
      LS.forEach(function(l, i){ h += '<button class="' + (cat[0] === 'neodent' ? l[0] : (i === 0 ? 'gm' : 'cm')) + (pLine === l[0] ? ' on' : '') + '" data-act="line" data-v="' + l[0] + '">' + l[1] + '</button>'; });
      h += '</div>';
      var shown = all.filter(function(x){ return x.line === pLine || x.line === 'all'; });
      if (shown.length === 0){
        h += '<div class="note">Nenhum item desta linha ainda.</div>';
      } else {
        h += '<div class="group" style="margin-top:0">';
        shown.forEach(function(x){
          var on = cartFind(cart, x.id) > -1;
          h += '<button class="cit' + (on ? ' on' : '') + '" data-act="cart" data-id="' + x.id + '" aria-pressed="' + on + '"><span class="tx"><b>' + x.name + '</b><span class="d">' + x.desc.split(' || ').join('<br>') + '</span>' + (x.code ? '<span class="d">Cód. ' + x.code + '</span>' : '') + (x.ok ? '' : '<span class="d">Não conferido no catálogo 2026</span>') + '</span><span class="add">' + (on ? '✓ Na lista' : '+ Adicionar') + '</span></button>';
        });
        h += '</div><p class="foot">Toque em um componente para adicionar à lista de compras. Toque de novo para tirar.</p>';
      }
    }
    h += '<div class="row"><button class="btn" data-act="cback">Voltar</button></div>';
  }
  return h;
}

function lineName(x){ var L2 = LINES[x.brand] || []; for (var i = 0; i < L2.length; i++) if (L2[i][0] === x.line) return L2[i][1]; return x.line.toUpperCase(); }

function compras(){
  var cart = load('cart'), h = '<div class="banner gm" style="margin-top:16px"><h2>Lista de compras</h2><p class="sub" style="color:inherit">Os componentes que você tocar no Catálogo aparecem aqui</p></div>';
  if (cart.length === 0){
    h += '<div class="note">Sua lista está vazia. Abra o Catálogo e toque em um componente para adicionar.</div><div class="row"><button class="btn" data-act="opencat">Abrir catálogo</button></div>';
    return h;
  }
  h += '<div class="group" style="margin-top:0">';
  cart.forEach(function(c){
    var x = itemById(c.id);
    if (!x) return;
    h += '<div class="crow' + (c.done ? ' done' : '') + '">'
      + '<button class="cbox" data-act="cdone" data-id="' + c.id + '" aria-label="Marcar como comprado" aria-pressed="' + !!c.done + '">✓</button>'
      + '<span class="tx"><b>' + x.name + '</b><span class="d">' + BRANDS[x.brand] + ' · ' + areaLabel(areaOf(x)) + ' · ' + catLabel(x.cat) + (x.line === 'all' ? '' : ' · ' + lineName(x)) + (x.code ? ' · ' + x.code : '') + '</span></span>'
      + '<span class="qty"><button class="qb" data-act="qminus" data-id="' + c.id + '" aria-label="' + (c.q === 1 ? 'Remover da lista' : 'Diminuir') + '">' + (c.q === 1 ? '×' : '−') + '</button><span class="qn">' + c.q + '</span><button class="qb" data-act="qplus" data-id="' + c.id + '" aria-label="Aumentar">+</button></span></div>';
  });
  h += '</div><div class="row"><button class="btn" data-act="clearcart">Limpar lista</button></div>';
  h += '<p class="foot">Códigos do catálogo mudam. Confirme com o representante antes de fechar o pedido.</p>';
  return h;
}

function render(){
  var app = document.getElementById('app');
  app.innerHTML = view === 'guia' ? guia() : view === 'catalogo' ? catalogo() : compras();
  VIEWS.forEach(function(v){
    document.getElementById('t-' + v).className = v === view ? 'on' : '';
  });
  var n = load('cart').length;
  document.getElementById('t-compras').textContent = n ? 'Compras · ' + n : 'Compras';
}

function setView(v){
  view = v;
  if (location.hash !== '#' + v) { try { history.replaceState(null, '', '#' + v); } catch(e){} }
  render();
  window.scrollTo(0, 0);
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var a = el.getAttribute('data-act'), v = el.getAttribute('data-v'), id = el.getAttribute('data-id');
  var i = parseInt(el.getAttribute('data-i'), 10), n = parseInt(el.getAttribute('data-n'), 10);
  if (a === 'tab') return setView(v);
  if (a === 'opencat') return setView('catalogo');
  if (a === 'brand') brand = v;
  else if (a === 'pick') path.push(v);
  else if (a === 'ninfo') info = true;
  else if (a === 'ninfo-off') info = false;
  else if (a === 'fase'){ fase = v; path = []; }
  else if (a === 'gobrand'){ fase = null; path = []; }
  else if (a === 'back'){ if (path.length) path.pop(); else if (fase) fase = null; else brand = null; }
  else if (a === 'reset'){ brand = null; fase = null; path = []; info = false; }
  else if (a === 'goto') path = path.slice(0, n);
  else if (a === 'step') toggle('done:' + keyNow(), i);
  else if (a === 'clear') save('done:' + keyNow(), []);
  else if (a === 'line') pLine = v;
  else if (a === 'cpick') cat.push(v);
  else if (a === 'cback') cat.pop();
  else if (a === 'creset') cat = [];
  else if (a === 'cgoto') cat = cat.slice(0, n);
  else if (a === 'cart') cartToggle(id);
  else if (a === 'cdone') cartDone(id);
  else if (a === 'qplus') cartQty(id, 1);
  else if (a === 'qminus') cartQty(id, -1);
  else if (a === 'clearcart') save('cart', []);
  var y = window.scrollY;
  render();
  var keep = a === 'step' || a === 'line' || a === 'cart' || a === 'cdone' || a === 'qplus' || a === 'qminus';
  if (keep) window.scrollTo(0, y); else window.scrollTo(0, 0);
});

window.addEventListener('hashchange', function(){
  var h = location.hash.slice(1);
  if (has(VIEWS, h)){ view = h; render(); }
});
(function(){
  var h = location.hash.slice(1);
  if (has(VIEWS, h)) view = h;
  render();
})();
</script>

</body></html>
